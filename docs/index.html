<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>つなぐろぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#FBF3E7; --surface:#FFFBF2; --surface-alt:#F3E8D6; --text:#3B2E27; --text-muted:#7A6A5C;
    --border:#E6D8C3; --accent:#C1694F; --accent-soft:#F3DCD3; --avatar:#D9C3A5; --avatar-text:#4A3B2B;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#2A2119; --surface:#352A20; --surface-alt:#3E3226; --text:#F1E6D8; --text-muted:#C9B8A6;
      --border:#4A3C2E; --accent:#E08464; --accent-soft:rgba(224,132,100,0.16); --avatar:#6B5640; --avatar-text:#F6EBDD;
      color-scheme: dark;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px;}
  button{font:inherit;color:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  header{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  header .logo{width:40px;height:40px;flex-shrink:0;}
  header h1{margin:0;font-size:1.4rem;font-weight:900;}
  header .tag{font-size:0.78rem;color:var(--text-muted);margin-top:-4px;}
  header .spacer{flex:1;}
  header .who{font-size:0.8rem;color:var(--text-muted);text-align:right;}
  .link-btn{background:none;border:none;color:var(--accent);padding:0;font-size:0.8rem;text-decoration:underline;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;}

  /* login */
  .login{max-width:420px;margin:48px auto;text-align:center;}
  .login .big-knot{width:110px;height:110px;margin:0 auto 8px;}
  .login h2{margin:0 0 4px;font-size:1.6rem;font-weight:900;}
  .login p.lead{margin:0 0 20px;color:var(--text-muted);font-size:0.9rem;}
  .login label{display:block;text-align:left;font-size:0.82rem;color:var(--text-muted);margin:12px 0 4px;}
  .login input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font:inherit;}
  .primary{display:block;width:100%;margin-top:18px;padding:12px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;}
  .primary:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:12px;font-size:0.85rem;color:var(--accent);min-height:1.2em;}

  /* status */
  .status{margin-bottom:18px;}
  .status h2{margin:0 0 10px;font-size:0.9rem;color:var(--text-muted);font-weight:700;}
  .members{display:flex;flex-wrap:wrap;gap:14px 12px;justify-content:center;align-items:flex-start;}
  .member{width:84px;text-align:center;}
  .member.self{width:104px;}
  .avatar-wrap{position:relative;width:60px;height:60px;margin:6px auto 0;}
  .member.self .avatar-wrap{width:84px;height:84px;}
  .avatar{width:100%;height:100%;border-radius:50%;background:var(--avatar);color:var(--avatar-text);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.5rem;overflow:hidden;}
  .member.self .avatar{font-size:2rem;}
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar .emoji{font-size:1.9rem;line-height:1;}
  .member.self .avatar .emoji{font-size:2.6rem;}
  .badge{position:absolute;right:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:var(--surface);padding:1px;}
  .member.self .badge{width:36px;height:36px;}
  .member .name{margin-top:6px;font-size:0.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .status .note{font-size:0.85rem;color:var(--text-muted);text-align:center;}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px;}
  .tab{flex:1;padding:10px;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-weight:700;color:var(--text-muted);}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head h3{margin:0;font-size:1.1rem;}
  .nav-btn{background:none;border:1px solid var(--border);border-radius:999px;padding:4px 14px;color:var(--accent);font-weight:700;}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .dow{font-size:0.75rem;color:var(--text-muted);text-align:center;padding:4px 0;}
  .day{min-height:62px;border-radius:12px;border:1px solid transparent;background:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .day.has{background:var(--surface-alt);}
  .day.sel{border-color:var(--accent);}
  .day.today .num{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;}
  .day .num{font-size:0.8rem;}
  .day .knot{width:28px;height:28px;}
  .day .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:9px;}
  .day.empty{visibility:hidden;}
  .detail{margin-top:16px;}
  .detail h4{margin:0 0 8px;font-size:0.95rem;}
  .entry{padding:10px 0;border-top:1px solid var(--border);}
  .entry:first-of-type{border-top:none;}
  .entry .time{font-size:0.78rem;color:var(--text-muted);}
  .entry .kind{display:inline-block;font-size:0.7rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 8px;margin-left:6px;}
  .entry .text{white-space:pre-wrap;word-break:break-word;margin-top:2px;}
  .empty-note{color:var(--text-muted);font-size:0.9rem;}

  /* list */
  .list-date{font-size:0.85rem;color:var(--text-muted);font-weight:700;margin:16px 0 4px;}
  .list-date:first-child{margin-top:0;}

  /* record */
  .rec h3{margin:0 0 4px;font-size:1.05rem;}
  .rec .sub{margin:0 0 10px;color:var(--text-muted);font-size:0.85rem;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
  .chip{padding:8px 16px;border:1px solid var(--border);border-radius:999px;background:var(--bg);font-weight:700;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .rec .btn{padding:10px 26px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;}
  .rec .btn:disabled{opacity:.45;cursor:default;}
  .rec .or{margin:22px 0 14px;color:var(--text-muted);font-size:0.85rem;text-align:center;}
  .rec textarea{width:100%;min-height:200px;padding:14px;border:1px solid var(--border);border-radius:16px;background:var(--bg);color:var(--text);font:inherit;resize:vertical;line-height:1.8;}
  .rec .row{display:flex;align-items:center;gap:12px;margin-top:10px;}
  .rec .hint{font-size:0.78rem;color:var(--text-muted);}
  .rec .result{margin-top:14px;display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;}
  .rec .result .knot-pop{width:44px;height:44px;animation:pop .6s ease-out;}
  @keyframes pop{from{transform:scale(.2) rotate(-40deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}
  .foot{margin-top:28px;text-align:center;font-size:0.75rem;color:var(--text-muted);}
  @media (max-width:520px){ .day{min-height:54px;} .day .knot{width:24px;height:24px;} }
</style>
</head>

<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 200 200" role="img" aria-label="梅結び"><use href="#ume"/></svg>
    <div>
      <h1>つなぐろぐ</h1>
      <div class="tag">離れている家族の毎日をそっとつなぐ。</div>
    </div>
    <div class="spacer"></div>
    <div class="who hidden" id="who"><div id="who-email"></div><button class="link-btn" id="logout">ログアウト</button></div>
  </header>

  <!-- ログイン -->
  <section id="login-view" class="card login hidden">
    <svg class="big-knot" viewBox="0 0 200 200" role="img" aria-label="梅結び"><use href="#ume"/></svg>
    <h2>ログイン</h2>
    <p class="lead">アプリと同じメールアドレスとパスワードで入れます。</p>
    <form id="login-form" autocomplete="on">
      <label for="email">メールアドレス</label>
      <input id="email" type="email" inputmode="email" autocomplete="username" required>
      <label for="password">パスワード</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" id="login-btn" type="submit">ログイン</button>
      <div class="msg" id="login-msg" role="alert"></div>
    </form>
  </section>

  <!-- 本体 -->
  <main id="app-view" class="hidden">
    <section class="card status" id="status-card">
      <h2>家族のステータス</h2>
      <div id="members"></div>
    </section>

    <div class="tabs">
      <button class="tab on" id="tab-rec" type="button">記録</button>
      <button class="tab" id="tab-cal" type="button">カレンダー</button>
      <button class="tab" id="tab-list" type="button">リスト</button>
    </div>

    <section class="card rec" id="rec-view">
      <div id="routine-box"></div>
      <div class="or" id="or-line">―― または ――</div>
      <h3>ひとこと日記</h3>
      <p class="sub">今日あった良いことを書いてみましょう。誤字もそのまま残ります。</p>
      <textarea id="diary" placeholder="今日あった良いことを書いてみましょう"></textarea>
      <div class="row">
        <button class="btn" id="diary-btn" type="button" disabled>記録する</button>
        <span class="hint">Ctrl + Enter でも記録できます</span>
      </div>
      <div class="result" id="rec-result" role="status"></div>
    </section>

    <section class="card hidden" id="cal-view">
      <div class="cal-head">
        <button class="nav-btn" id="prev" type="button">＜ 前月</button>
        <h3 id="month-title"></h3>
        <button class="nav-btn" id="next" type="button">翌月 ＞</button>
      </div>
      <div class="grid" id="dow"></div>
      <div class="grid" id="days"></div>
      <div class="detail" id="detail"></div>
    </section>

    <section class="card hidden" id="list-view"></section>

    <p class="foot">書いた内容を読めるのは、本人だけです。</p>
  </main>
</div>

<script>
const SB_URL = "https://mvubkpesgiqofhfyshpo.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12dWJrcGVzZ2lxb2ZoZnlzaHBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjY1MjEsImV4cCI6MjEwNDE0MjUyMX0.4EgWAtkMF0KmMhxE-8VipZCqa1f8zjGUC-Y4IUY01N8";
const GAS_URL = "https://script.google.com/macros/s/AKfycbyXkslHU3pWBwuZinDrhL8atxemJetmzU9sIVPThn9QxyI2wLBekv0FRQqcSmXsMzgM/exec";
const DEMO = new URLSearchParams(location.search).has("demo");

let sb = null;
if (!DEMO) {
  sb = supabase.createClient(SB_URL, SB_KEY, {
    auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true },
  });
}

const $ = (id) => document.getElementById(id);
const KNOT = '<svg class="knot" viewBox="0 0 200 200" aria-hidden="true"><use href="#ume"/></svg>';

const jstKey = new Intl.DateTimeFormat("sv-SE", { timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit" });
const jstTime = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "numeric", minute: "2-digit", hour12: false });
const dayKey = (iso) => jstKey.format(new Date(iso));
const todayKey = () => jstKey.format(new Date());

let logs = [];
let members = [];
let view = { y: 0, m: 0 };     // m: 0-11
let selectedDay = null;
let tab = "rec";
let routines = [];
let picked = {};          // routine.id -> option
let sending = false;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* ---------- データ ---------- */
function demoData() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const mk = (d, h, min, text, routine) => ({
    id: "d" + d + h, created_at: new Date(Date.UTC(y, m, d, h - 9, min)).toISOString(),
    raw_text: text, polished_text: text, is_checkbox: !!routine,
  });
  logs = [
    mk(1, 21, 5, "歯を磨いたか？: 磨いた", true),
    mk(2, 20, 40, "今日は友だちとごはんに行った。唐揚げがおいしかった。", false),
    mk(2, 22, 10, "歯を磨いたか？: これから", true),
    mk(4, 19, 30, "引っ越しの荷ほどきが終わった。", false),
    mk(5, 21, 0, "歯を磨いたか？: 磨いた", true),
    mk(7, 22, 15, "久しぶりに実家に電話した。母が元気そうでよかった。", false),
    mk(8, 21, 30, "歯を磨いたか？: 磨いた", true),
  ].sort((a, b) => b.created_at.localeCompare(a.created_at));
  members = [
    { is_self: true, nickname: "つむぎ", logged_today: true, avatar_emoji: "", avatar_image: "" },
    { is_self: false, nickname: "お母さん", logged_today: false, avatar_emoji: "🌷", avatar_image: "" },
    { is_self: false, nickname: "お父さん", logged_today: true, avatar_emoji: "", avatar_image: "" },
    { is_self: false, nickname: "お兄さん", logged_today: true, avatar_emoji: "🐶", avatar_image: "" },
  ];
}

async function callGas(payload) {
  if (DEMO) return demoGas(payload);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("no session");
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ ...payload, access_token: session.access_token, user_id: session.user.id }),
  });
  return res.json();
}

function demoGas(p) {
  if (p.source === "get_group_today") return { status: "ok", members };
  if (p.source === "get_routines") return { status: "ok", routines: [{ id: "r1", prompt: "歯を磨いたか？", options: ["磨いた", "これから"] }] };
  const now = new Date().toISOString();
  if (p.source === "submit_routine_answers") {
    p.answers.forEach((a) => logs.unshift({ id: "x" + Math.random(), created_at: now, raw_text: a.prompt + ": " + a.selected_option, polished_text: a.prompt + ": " + a.selected_option, is_checkbox: true }));
    members.forEach((m) => { if (m.is_self) m.logged_today = true; });
    return { status: "ok" };
  }
  if (p.source === "android") {
    logs.unshift({ id: "x" + Math.random(), created_at: now, raw_text: p.raw_text, polished_text: p.raw_text, is_checkbox: false });
    members.forEach((m) => { if (m.is_self) m.logged_today = true; });
    return { status: "ok" };
  }
  return { status: "error" };
}

async function loadRoutines() {
  const json = await callGas({ source: "get_routines" });
  routines = json.status === "ok" ? (json.routines || []).map((r) => ({ id: r.id, prompt: r.prompt, options: r.options || [] })) : [];
}

async function loadLogs() {
  if (DEMO) return;
  const { data, error } = await sb.from("logs")
    .select("id,created_at,raw_text,polished_text,is_checkbox")
    .order("created_at", { ascending: false }).limit(1000);
  if (error) throw error;
  logs = data || [];
}

async function loadStatus() {
  const json = await callGas({ source: "get_group_today" });
  members = json.status === "ok" ? (json.members || []) : [];
}

/* ---------- 表示：ステータス ---------- */
function renderStatus(error) {
  const box = $("members");
  box.replaceChildren();
  if (error) { box.appendChild(el("div", "note", "ステータスを読み込めませんでした。")); return; }
  if (members.length < 2) {
    box.appendChild(el("div", "note", "グループに2人以上いると、家族のステータスが表示されます。"));
    return;
  }
  const wrap = el("div", "members");
  [...members].sort((a, b) => (b.is_self ? 1 : 0) - (a.is_self ? 1 : 0)).forEach((m) => {
    const label = m.is_self ? "あなた" : (m.nickname || (m.email || "").split("@")[0] || "?");
    const item = el("div", "member" + (m.is_self ? " self" : ""));
    const aw = el("div", "avatar-wrap");
    const av = el("div", "avatar");
    if (m.avatar_image) {
      const img = document.createElement("img");
      img.alt = ""; img.src = "data:image/jpeg;base64," + m.avatar_image;
      av.appendChild(img);
    } else if (m.avatar_emoji) {
      av.appendChild(el("span", "emoji", m.avatar_emoji));
    } else {
      av.textContent = m.is_self ? "私" : label.slice(0, 1);
    }
    aw.appendChild(av);
    if (m.logged_today) {
      const b = el("div", "badge");
      b.innerHTML = KNOT;
      aw.appendChild(b);
    }
    item.appendChild(aw);
    item.appendChild(el("div", "name", label));
    wrap.appendChild(item);
  });
  box.appendChild(wrap);
}

/* ---------- 表示：記録 ---------- */
function setResult(text, withKnot) {
  const box = $("rec-result");
  box.replaceChildren();
  if (withKnot) { const k = el("span"); k.innerHTML = KNOT.replace('class="knot"', 'class="knot knot-pop"'); box.appendChild(k.firstChild); }
  if (text) box.appendChild(el("span", null, text));
}

function renderRoutine() {
  const box = $("routine-box");
  box.replaceChildren();
  const orLine = $("or-line");
  if (!routines.length) {
    orLine.classList.add("hidden");
    box.appendChild(el("p", "sub", "スマホのアプリの設定で「今日の問いかけ」を決めると、ここで選んで記録できます。"));
    return;
  }
  orLine.classList.remove("hidden");
  routines.forEach((r) => {
    box.appendChild(el("h3", null, r.prompt));
    const chips = el("div", "chips");
    r.options.forEach((o) => {
      const b = el("button", "chip" + (picked[r.id] === o ? " on" : ""), o);
      b.type = "button";
      b.addEventListener("click", () => { picked[r.id] = o; renderRoutine(); });
      chips.appendChild(b);
    });
    box.appendChild(chips);
  });
  const go = el("button", "btn", "記録する");
  go.type = "button";
  go.disabled = sending || !Object.keys(picked).length;
  go.addEventListener("click", submitRoutines);
  box.appendChild(go);
}

async function afterRecorded() {
  try { await loadLogs(); } catch (e) { console.error(e); }
  renderCalendar(); renderList();
  try { await loadStatus(); renderStatus(false); } catch (e) { console.error(e); }
}

async function submitRoutines() {
  if (sending) return;
  const answers = routines.filter((r) => picked[r.id]).map((r) => ({ routine_id: r.id, prompt: r.prompt, selected_option: picked[r.id] }));
  if (!answers.length) return;
  sending = true; renderRoutine(); setResult("送信しています…");
  try {
    const json = await callGas({ source: "submit_routine_answers", answers });
    if (json.status === "ok") { picked = {}; setResult("記録しました。", true); await afterRecorded(); }
    else setResult("記録できませんでした。もう一度お試しください。");
  } catch (e) { console.error(e); setResult("通信に失敗しました。もう一度お試しください。"); }
  finally { sending = false; renderRoutine(); }
}

async function submitDiary() {
  const text = $("diary").value.trim();
  if (sending || !text) return;
  sending = true; $("diary-btn").disabled = true; renderRoutine(); setResult("送信しています…");
  try {
    const json = await callGas({ source: "android", raw_text: text });
    if (json.status === "ok") { $("diary").value = ""; setResult("記録しました。", true); await afterRecorded(); }
    else setResult("記録できませんでした。もう一度お試しください。");
  } catch (e) { console.error(e); setResult("通信に失敗しました。もう一度お試しください。"); }
  finally { sending = false; $("diary-btn").disabled = !$("diary").value.trim(); renderRoutine(); }
}

/* ---------- 表示：カレンダー ---------- */
function dayInfo() {
  const info = {};
  logs.forEach((l) => {
    const k = dayKey(l.created_at);
    const d = info[k] || (info[k] = { free: [], routine: [] });
    (l.is_checkbox ? d.routine : d.free).push(l);
  });
  return info;
}

function renderCalendar() {
  const info = dayInfo();
  $("month-title").textContent = view.y + "年" + (view.m + 1) + "月";

  const dow = $("dow");
  if (!dow.childNodes.length) ["月", "火", "水", "木", "金", "土", "日"].forEach((w) => dow.appendChild(el("div", "dow", w)));

  const days = $("days");
  days.replaceChildren();
  const first = new Date(Date.UTC(view.y, view.m, 1)).getUTCDay();   // 0=日
  const offset = (first + 6) % 7;                                       // 月曜はじまり
  const count = new Date(Date.UTC(view.y, view.m + 1, 0)).getUTCDate();
  for (let i = 0; i < offset; i++) days.appendChild(el("div", "day empty"));
  const today = todayKey();
  for (let d = 1; d <= count; d++) {
    const key = view.y + "-" + String(view.m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const rec = info[key];
    const btn = el("button", "day" + (rec ? " has" : "") + (key === today ? " today" : "") + (key === selectedDay ? " sel" : ""));
    btn.type = "button";
    btn.appendChild(el("span", "num", String(d)));
    if (rec && rec.free.length) { const k = el("span"); k.innerHTML = KNOT; btn.appendChild(k.firstChild); }
    else if (rec && rec.routine.length) btn.appendChild(el("span", "dot"));
    btn.addEventListener("click", () => { selectedDay = key; renderCalendar(); renderDetail(info); });
    days.appendChild(btn);
  }
  renderDetail(info);
}

function entryNode(l) {
  const e = el("div", "entry");
  const t = el("div", "time", jstTime.format(new Date(l.created_at)));
  if (l.is_checkbox) t.appendChild(el("span", "kind", "今日の問いかけ"));
  e.appendChild(t);
  e.appendChild(el("div", "text", l.polished_text || l.raw_text || ""));
  return e;
}

function renderDetail(info) {
  const box = $("detail");
  box.replaceChildren();
  if (!selectedDay) { box.appendChild(el("div", "empty-note", "日付を選ぶと、その日の記録を読めます。")); return; }
  const [y, m, d] = selectedDay.split("-");
  box.appendChild(el("h4", null, Number(m) + "月" + Number(d) + "日の記録"));
  const rec = info[selectedDay];
  if (!rec) { box.appendChild(el("div", "empty-note", "この日の記録はありません。")); return; }
  [...rec.free, ...rec.routine].sort((a, b) => a.created_at.localeCompare(b.created_at)).forEach((l) => box.appendChild(entryNode(l)));
}

/* ---------- 表示：リスト ---------- */
function renderList() {
  const box = $("list-view");
  box.replaceChildren();
  if (!logs.length) { box.appendChild(el("div", "empty-note", "まだ記録がありません。")); return; }
  let last = "";
  logs.forEach((l) => {
    const k = dayKey(l.created_at);
    if (k !== last) {
      const [y, m, d] = k.split("-");
      box.appendChild(el("div", "list-date", y + "年" + Number(m) + "月" + Number(d) + "日"));
      last = k;
    }
    box.appendChild(entryNode(l));
  });
}

/* ---------- 画面切り替え ---------- */
function setTab(t) {
  tab = t;
  $("tab-rec").classList.toggle("on", t === "rec");
  $("rec-view").classList.toggle("hidden", t !== "rec");
  $("tab-cal").classList.toggle("on", t === "cal");
  $("tab-list").classList.toggle("on", t === "list");
  $("cal-view").classList.toggle("hidden", t !== "cal");
  $("list-view").classList.toggle("hidden", t !== "list");
}

function showLogin() {
  $("login-view").classList.remove("hidden");
  $("app-view").classList.add("hidden");
  $("who").classList.add("hidden");
}

async function showApp(email) {
  $("login-view").classList.add("hidden");
  $("app-view").classList.remove("hidden");
  $("who").classList.remove("hidden");
  $("who-email").textContent = email || "";

  const now = new Date();
  const [y, m] = todayKey().split("-").map(Number);
  view = { y, m: m - 1 };
  selectedDay = todayKey();
  setTab("rec");

  if (DEMO) demoData();
  renderCalendar(); renderList(); renderRoutine();
  loadRoutines().then(renderRoutine).catch((e) => { console.error(e); renderRoutine(); });
  try { await loadLogs(); renderCalendar(); renderList(); }
  catch (e) { console.error(e); $("detail").replaceChildren(el("div", "empty-note", "記録を読み込めませんでした。時間をおいて、もう一度お試しください。")); }

  if (DEMO) { renderStatus(false); return; }
  try { await loadStatus(); renderStatus(false); } catch (e) { console.error(e); renderStatus(true); }
}

function authMessage(err) {
  const msg = (err && err.message) || "";
  if (/invalid login credentials/i.test(msg)) return "メールアドレスまたはパスワードが違います。";
  if (/email not confirmed/i.test(msg)) return "メールアドレスの確認が済んでいません。";
  if (/rate limit|too many/i.test(msg)) return "短い時間に何度も試されたため、しばらくしてからお試しください。";
  return "ログインできませんでした。時間をおいて、もう一度お試しください。";
}

/* ---------- イベント ---------- */
$("email").addEventListener("input", (e) => {   // 全角の「＠」などで間違えないよう、半角の英数字・記号だけにする
  const v = e.target.value.replace(/[^\x21-\x7E]/g, "");
  if (v !== e.target.value) e.target.value = v;
});
$("login-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("login-msg").textContent = "";
  $("login-btn").disabled = true;
  try {
    const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) $("login-msg").textContent = authMessage(error);
  } catch (e) {
    $("login-msg").textContent = "通信に失敗しました。もう一度お試しください。";
  } finally {
    $("login-btn").disabled = false;
  }
});
$("logout").addEventListener("click", async () => {
  if (DEMO) { location.href = location.pathname; return; }
  await sb.auth.signOut();
});
$("prev").addEventListener("click", () => { view.m--; if (view.m < 0) { view.m = 11; view.y--; } renderCalendar(); });
$("next").addEventListener("click", () => { view.m++; if (view.m > 11) { view.m = 0; view.y++; } renderCalendar(); });
$("tab-rec").addEventListener("click", () => setTab("rec"));
$("tab-cal").addEventListener("click", () => setTab("cal"));
$("diary").addEventListener("input", () => { $("diary-btn").disabled = sending || !$("diary").value.trim(); });
$("diary").addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") submitDiary(); });
$("diary-btn").addEventListener("click", submitDiary);
$("tab-list").addEventListener("click", () => setTab("list"));

/* ---------- 起動 ---------- */
if (DEMO) {
  showApp("demo@example.com");
} else {
  let started = false;
  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user) { if (!started) { started = true; showApp(session.user.email); } }
    else { started = false; logs = []; members = []; routines = []; picked = {}; showLogin(); }
  });
  sb.auth.getSession().then(({ data: { session } }) => { if (!session) showLogin(); });
}
</script>
</body>
</html>
